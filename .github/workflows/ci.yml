name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs Vite+, Node (from .node-version), pnpm (from packageManager),
      # and the dependencies (`vp install`).
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true

      - run: vp check
      - run: vp test
      # Preview build: mock content is allowed. The launch build sets SITE_ENV=production.
      - run: vp run build
