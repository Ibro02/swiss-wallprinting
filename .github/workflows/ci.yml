name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Installs Vite+, Node (from .node-version), pnpm (from packageManager),
      # and the dependencies (`vp install`).
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true

      # The type check needs the types that Next.js generates (next-env.d.ts with the image
      # types, .next/types): a fresh checkout has none, because git ignores them.
      - run: vp run typegen
      - run: vp check
      - run: vp test
      # Preview build: mock content is allowed. The launch build sets SITE_ENV=production.
      - run: vp run build

  # Phase 6: the browser tests (Playwright: flows, WCAG 2.2 AA with axe, JS budgets) and
  # Lighthouse CI, both against the production build on port 3001.
  quality:
    needs: check
    runs-on: ubuntu-latest
    env:
      # Canonical and sitemap URLs on the test server itself (Lighthouse checks the canonical).
      SITE_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          cache: true
      - run: vp run build
      - run: npx playwright install --with-deps chromium
      # Starts the server itself (playwright.config.ts: port 3001, form e-mails to the outbox).
      - run: vp run e2e
      - name: Lighthouse CI
        id: lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json --collect.startServerCommand="vp run start"
        env:
          PORT: '3001'
      # The scores of every run, passed or failed: a table on the run's summary page, and the
      # HTML reports (each page, each run) as the artefact `lighthouse`. Lighthouse CI writes
      # them also when an assertion fails; skipped only when Lighthouse did not run.
      - if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        run: vp run lighthouse:summary
      - if: ${{ !cancelled() && steps.lighthouse.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: test-results/lighthouse/
          retention-days: 14
      # Playwright traces and screenshots, only when a step failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            !test-results/lighthouse/
          retention-days: 7
